name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore LT1Diagnostics.sln --locked-mode --configfile NuGet.Config
      - name: Build
        run: dotnet build LT1Diagnostics.sln --configuration ${{ matrix.configuration }} --no-restore
      - name: Test
        run: dotnet test LT1Diagnostics.sln --configuration ${{ matrix.configuration }} --no-build --no-restore --filter "Category!=Hardware"
      - name: Formatting and analyzer verification
        run: dotnet format LT1Diagnostics.sln --verify-no-changes --no-restore

  publish-smoke:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - name: Publish self-contained desktop app
        run: dotnet publish src/LT1Diagnostics.App/LT1Diagnostics.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output artifacts/${{ matrix.rid }}
      - name: Upload self-contained application
        uses: actions/upload-artifact@v4
        with:
          name: 4L60-Diagnostics-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
      - name: Build Windows installer archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Build Linux installer archive
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/package-linux.ps1
      - name: Smoke-test Linux per-user install and uninstall
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash artifacts/4L60-Diagnostics-linux-x64/install.sh
          test -x "$HOME/.local/opt/4l60-diagnostics/4L60-Diagnostics"
          test -L "$HOME/.local/bin/4l60-diagnostics"
          test -f "$HOME/.local/share/applications/4l60-diagnostics.desktop"
          bash "$HOME/.local/opt/4l60-diagnostics/uninstall.sh"
          test ! -e "$HOME/.local/opt/4l60-diagnostics"
      - name: Upload Windows installer archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: 4L60-Diagnostics-win-x64-installer
          path: artifacts/4L60-Diagnostics-win-x64.zip
      - name: Upload Linux installer archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: 4L60-Diagnostics-linux-x64-installer
          path: artifacts/4L60-Diagnostics-linux-x64.tar.gz
